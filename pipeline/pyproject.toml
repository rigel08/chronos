[project]
name = "chronos-pipeline"
version = "0.3.0"
description = "CHRONOS source-aware historical data pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "brotli==1.2.*",
  "mapbox-earcut==2.1.*",
  "numpy>=1.26,<3",
  "pillow==12.3.*",
  "pyproj==3.7.*",
  "pyyaml==6.0.*",
  "shapely==2.1.*",
]

[project.scripts]
chronos-pipeline = "chronos_pipeline.cli:main"

[dependency-groups]
dev = [
  "mypy==1.*",
  "pytest==8.*",
  "ruff==0.*",
  "types-PyYAML",
  "types-shapely",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronos_pipeline"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["data: needs the pinned real inputs (run `make fetch` first)"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pyproj", "pyproj.*"]
ignore_missing_imports = true
follow_untyped_imports = false
