# Source registry (D-007, D-010). access_tier defaults to research_only when omitted.
# A source may be `public` only if its licence allows commercial use or a permission is recorded
# in permissions.yaml. The registry loader rejects anything else.

- id: cliopatria
  kind: dataset
  title: "Cliopatria: a geospatial database of world-wide political entities from 3400BCE to 2024CE"
  authors: [Seshat Global History Databank]
  url: https://github.com/Seshat-Global-History-Databank/cliopatria
  doi: 10.1038/s41597-025-04516-9
  license: CC-BY-4.0
  access_tier: public
  adapter: cliopatria
  citation: "Cliopatria v0.2.1, Seshat Global History Databank (CC BY 4.0). Borders not simplified; split on a 5° grid and triangulated for rendering by CHRONOS."
  evidence: interpreted        # an atlas interpretation of past territories (data-model.md); the source states no confidence

- id: natural-earth-land
  kind: dataset
  title: Natural Earth land polygons (1:10m, 1:50m, 1:110m) via world-atlas 2.0.2
  authors: [Natural Earth, Mike Bostock (world-atlas)]
  url: https://github.com/topojson/world-atlas
  license: LicenseRef-NaturalEarth-PD
  access_tier: public
  adapter: naturalearth
  citation: "Made with Natural Earth. Land polygons via world-atlas 2.0.2."

- id: natural-earth-lakes
  kind: dataset
  title: Natural Earth 1:50m lakes (natural-earth-vector v5.1.2)
  authors: [Natural Earth]
  url: https://www.naturalearthdata.com/downloads/50m-physical-vectors/
  license: LicenseRef-NaturalEarth-PD
  access_tier: public
  adapter: naturalearth
  citation: "Made with Natural Earth. Lakes and rivers 1:50m (v5.1.2), modern physical geography."

- id: natural-earth-rivers
  kind: dataset
  title: Natural Earth 1:50m rivers and lake centrelines (natural-earth-vector v5.1.2)
  authors: [Natural Earth]
  url: https://www.naturalearthdata.com/downloads/50m-physical-vectors/
  license: LicenseRef-NaturalEarth-PD
  access_tier: public
  adapter: naturalearth
  citation: "Made with Natural Earth. Lakes and rivers 1:50m (v5.1.2), modern physical geography."

- id: natural-earth-relief
  kind: dataset
  title: Natural Earth 1:50m shaded relief (SR_50M, version 2.0.0)
  authors: [Natural Earth, Tom Patterson]
  url: https://www.naturalearthdata.com/downloads/50m-raster-data/50m-shaded-relief/
  license: LicenseRef-NaturalEarth-PD
  access_tier: public
  adapter: naturalearth
  citation: "Made with Natural Earth. Shaded relief 1:50m (version 2.0.0), re-projected to hillshade tiles by CHRONOS."

- id: wikidata
  kind: dataset
  title: Wikidata (labels, types and dates for QIDs asserted by Cliopatria)
  authors: [Wikidata contributors]
  url: https://www.wikidata.org
  license: CC0-1.0
  access_tier: public
  adapter: wikidata
  citation: "Wikidata (CC0), snapshot taken through the Wikidata Query Service."

- id: chronos-editorial
  kind: editorial
  title: CHRONOS editorial cross-reference corrections
  authors: [CHRONOS project]
  license: LicenseRef-CHRONOS-Editorial
  access_tier: public
  adapter: editorial
  citation: "CHRONOS editorial corrections, verified against Wikidata."

