# Build parameters. Every value here is copied into trace.json (D-013).
pipeline_profile_sources: [cliopatria, natural-earth-land, natural-earth-lakes, natural-earth-rivers, natural-earth-relief,
                           wikidata, chronos-editorial]

identity:
  # D-016: rows sharing a name are split into separate polities at an internal gap longer than
  # max_gap_years, unless aggregate rows cover at least switch_coverage of the gap (the polity
  # continues but is drawn through allegiance/grouping rows).
  max_gap_years: 50
  switch_coverage: 0.5

qa:
  area_tolerance: 0.01               # QA-003: relative difference allowed vs the source Area field
  # Astronomical years (0 = 1 BCE): -499 is 500 BCE.
  checkpoint_years: [-499, 117, 420, 1000, 1500, 1914]   # QA-004/005 at full resolution
  coverage_step_years: 100           # QA-011 sampling step over the dataset's range
  sliver_km2: 1000                   # QA-004 sliver threshold
  sliver_fraction: 0.01
  # QA-009: a part at least stray_part_km from the main body, smaller than stray_part_fraction of it, and absent
  # from the polity's neighbouring rows. The Soissons case is 26% of the main body, so size alone is a weak signal.
  stray_part_km: 500
  stray_part_fraction: 0.5
  point_checks:                      # QA-010
    - {name: Rome, lon: 12.4964, lat: 41.9028, tolerance_km: 5.0}

render:
  simplify_deg: 0.0                  # D-017: Cliopatria is already atlas-scale; render full resolution
  grid_split_deg: 5.0                # keeps triangles small enough to follow the globe's curvature
  # QA-013: every part is triangulated in the pipeline (D-021). The area the triangles draw must match the
  # polygon (Web Mercator plane). Judged in absolute km2 so near-zero slivers do not drown real defects:
  # above warn the part is reported, above error the build stops.
  triangulation_warn_km2: 0.01
  triangulation_error_km2: 1.0

testpoints:                          # ground truth for the renderer's pick-accuracy benchmark
  seed: 20261111
  years: 80
  inside_per_year: 5
  unmapped_per_year: 1
  margin_km: 60

overlaps:                            # D-026: every claimant drawn; classed with the QA-004 rule above
  max_level: 8                       # safety limit: the build stops if regions shared by this many rows exist

colours:                             # D-027: colours separate neighbours and carry no meaning
  neighbour_gap_deg: 0.1             # rows this close (degrees) while both valid count as neighbours
  distinct_at: 0.12                  # OKLab distance at which two colours stop counting as similar
  # Strata pigments (design-direction.md) plus sienna, olive and cerulean; papal gold dropped (too close to orpiment)
  palette: ["#cf5637", "#4b70c6", "#d9a845", "#4fae9f", "#57a067", "#b25c87", "#7a6fb0", "#a8693f", "#9aa04f", "#4d9fd0"]
  palette_names: [cinnabar, lapis, orpiment, verdigris, malachite, madder, smalt, sienna, olive, cerulean]

basemap:                             # modern physical geography, context only
  vector_decimals: 4                 # about 11 m
  relief:                            # Natural Earth SR_50M -> transparent hillshade tiles (Web Mercator)
    minzoom: 0
    maxzoom: 4
    tile_size: 512
    flat: 206                        # SR_50M value of flat ground and sea (70% of pixels)
    deadband: 3                      # +/- levels around flat treated as flat (flat ground varies by a few levels)
    alpha_levels: 32
    gamma: 0.7
    shadow_alpha: 1.0
    highlight_alpha: 0.6
    shadow_rgb: "#05070a"
    highlight_rgb: "#e9e2d2"
    webp_quality: 70
    webp_alpha_quality: 70

delivery:                            # D-024, D-025: content-hashed files with deterministic precompressed copies
  brotli_quality: 11
  brotli_lgwin: 24
  gzip_level: 9
  hash_length: 12
